apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: solarbi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: solarbi-etl:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.simulator"]
          envFrom:
            - configMapRef:
                name: solarbi-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: solarbi-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: solarbi-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 96Mi
