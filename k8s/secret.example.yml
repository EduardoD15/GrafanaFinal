# Plantilla del Secret. NO se aplica ni se versiona con valores reales.
# run.ps1 crea el Secret real con los valores de .env:
#   kubectl create secret generic solarbi-secrets -n solarbi --from-literal=POSTGRES_USER=... (ver run.ps1)
apiVersion: v1
kind: Secret
metadata:
  name: solarbi-secrets
  namespace: solarbi
type: Opaque
stringData:
  POSTGRES_USER: solarbi
  POSTGRES_PASSWORD: CAMBIAR
  BI_READER_USER: solarbi_reader
  BI_READER_PASSWORD: CAMBIAR
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASSWORD: CAMBIAR
