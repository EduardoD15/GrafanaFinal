apiVersion: 1

groups:
  - orgId: 1
    name: solarbi-operacion
    folder: SolarBI
    interval: 30s
    rules:
      - uid: solarbi-battery-low
        title: Bateria con estado de carga bajo
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: solarbi-pg
            model:
              datasource:
                type: postgres
                uid: solarbi-pg
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT min(battery_soc_pct) AS value FROM gold.fact_energy_reading WHERE is_simulated AND measured_at > now() - interval '2 minutes'"
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 30s
        annotations:
          summary: "El estado de carga simulado esta por debajo del 20 %."
          description: "Umbral de 20 %: en los datos reales solo 0,23 % (inversor 1) y 3,1 % (inversor 2) de las lecturas quedan por debajo. Validar inversor y revisar la tendencia en el tablero SolarBI."
        labels:
          severity: warning
          source: solarbi
        isPaused: false
      - uid: solarbi-stream-missing
        title: Flujo del simulador sin lecturas recientes
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 180
              to: 0
            datasourceUid: solarbi-pg
            model:
              datasource:
                type: postgres
                uid: solarbi-pg
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT count(*)::double precision AS value FROM gold.fact_energy_reading WHERE is_simulated AND measured_at > now() - interval '90 seconds'"
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 30s
        annotations:
          summary: "No hay muestras simuladas recientes."
          description: "El simulador escribe una lectura por segundo y por inversor; 90 s sin filas son casi cien lecturas perdidas. Comprobar el deployment del simulador y la conexion con PostgreSQL."
        labels:
          severity: critical
          source: solarbi
        isPaused: false
      - uid: solarbi-demo-random-alert
        title: Alerta aleatoria de demostracion sintetica
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: solarbi-pg
            model:
              datasource:
                type: postgres
                uid: solarbi-pg
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT count(*)::double precision AS value FROM gold.fact_event WHERE event_type = 'demo_random_alert' AND metadata->>'demo_only' = 'true' AND occurred_at > now() - interval '90 seconds'"
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Evento de demostracion sintetico; no es una falla real del inversor."
          description: "Se genera aleatoriamente por el simulador y se marca demo_only=true."
        labels:
          severity: warning
          source: solarbi-demo
        isPaused: false
