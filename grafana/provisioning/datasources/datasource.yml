apiVersion: 1

datasources:
  - name: SolarBI PostgreSQL
    uid: solarbi-pg
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
